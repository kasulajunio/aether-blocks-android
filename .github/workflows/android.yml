name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare reviewed source
        run: python3 prepare.py
      - name: Test and build APK
        run: bash build.sh
      - name: Enable emulator acceleration
        run: |
          echo KERNEL==\"kvm\",GROUP=\"kvm\",MODE=\"0666\",OPTIONS+=\"static_node=kvm\" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash smoke.sh
      - name: Publish downloadable prototype
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1 || gh release create v0.1 --title "Aether Blocks v0.1 - Prototipo Android" --notes "Sandbox original 2D. Espada, dash, mineracao, construcao, slimes, guardiao e progresso local. Sem permissoes de rede. APK de teste, nao e um jogo 3D completo."
          gh release upload v0.1 out/Aether-Blocks-v0.1.apk out/test-results.txt out/android-tests.txt out/apk-verification.txt out/apk-info.txt out/SHA256SUMS.txt out/screenshot.png --clobber
